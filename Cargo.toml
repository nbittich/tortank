[workspace]
members = ["libtortank", "tortank-wasm"]
resolver = "3"

[workspace.package]
version = "0.31.6"
authors = ["Nordine Bittich <contact@bittich.be>"]
homepage = "https://github.com/nbittich/tortank"
description = "Turtle/N triples parser"
license = "MIT"
repository = "https://github.com/nbittich/tortank"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
chrono = "0.4.45"
nom = "8.0.0"
nom-language = "0.1.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serial_test = "3.5.0"
test-case = "3.4.0"
tortank = { version = "0.31.6", path = './libtortank/' }

[workspace.dependencies.uuid]
version = "1.26.1"
features = ["v7"]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
