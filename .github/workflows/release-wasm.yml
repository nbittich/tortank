name: Release WASM

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          cd tortank-wasm 
          RUSTFLAGS='--cfg getrandom_backend="wasm_js" -Ctarget-cpu=mvp' wasm-pack build --target nodejs --release --scope nbittich   .
          # wasm-pack omits wasm-bindgen inline_js snippets from "files", so npm drops them
          jq '.files = ((.files // []) + ["snippets/"] | unique)' pkg/package.json > pkg/package.json.tmp
          mv pkg/package.json.tmp pkg/package.json
          # fail the build if the snippets are not going to be published
          npm pack --dry-run ./pkg 2>&1 | grep -q 'snippets/.*inline0.js' || { echo "snippets/ missing from npm package"; exit 1; }
          wasm-pack pack pkg

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: tortank-wasm/pkg
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download pkg
        uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg
      - name: Setup NPM
        uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
      - name: Smoke test packed package
        run: |
          cd pkg
          TGZ="$PWD/$(npm pack --silent)"
          NAME=$(jq -r .name package.json)
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$TGZ"
          node -e "require('$NAME')"
      - name: Publish on NPM
        run: |
          cd pkg
          npm install
          npm publish --access public
